[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardscope"
version = "0.0.1"
description = "Distributed training bottleneck profiler: per-step metrics, traces, and evidence-backed bottleneck hints."
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Joshua Wu" }]
keywords = ["pytorch", "profiler", "ddp", "nccl", "performance", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
shardscope = "shardscope.cli:main"

[project.urls]
Homepage = "https://github.com/joshwu108/ShardScope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires a CUDA device",
  "distributed: requires >=2 CUDA devices and torchrun",
  "slow: wall-clock heavy benchmark test",
]

[tool.coverage.run]
source = ["src/shardscope"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "benchmarks", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
