[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardscope"
# Single source of truth: src/shardscope/__init__.py:__version__ (see
# [tool.setuptools.dynamic]). tests/test_packaging.py pins them together.
dynamic = ["version"]
description = "Distributed training bottleneck profiler: per-step metrics, traces, and evidence-backed bottleneck hints."
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Joshua Wu" }]
keywords = ["pytorch", "profiler", "ddp", "nccl", "performance", "benchmark"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  # tomllib is stdlib from 3.11; the backport keeps the packaging-metadata
  # guards in tests/test_packaging.py running on the 3.10 CI leg too.
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
shardscope = "shardscope.cli:main"

[project.urls]
Homepage = "https://github.com/joshwu108/ShardScope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "shardscope.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers / --strict-config turn a typo'd marker or a stale config
# key into an error instead of a silently skipped guard.
addopts = "-q --strict-markers --strict-config"
markers = [
  "gpu: requires a CUDA device",
  "distributed: requires >=2 CUDA devices and torchrun",
  "slow: wall-clock heavy benchmark test",
]

[tool.coverage.run]
source = ["src/shardscope", "examples"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "benchmarks", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shardscope"]
# examples/ ships as runnable scripts rather than an installed package, so
# tests import them by bare module name via tests/conftest.py.
known-local-folder = ["train_single", "train_ddp"]
