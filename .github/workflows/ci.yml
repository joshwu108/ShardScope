name: ci

# Every gate below is defined in tools/dev.py and invoked through it, so a
# local run and a CI run execute the same commands. Do not re-spell a check
# inline here -- tests/test_dev_commands.py fails if you do.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          . .venv/bin/activate
          python tools/dev.py lint

      - name: Format
        run: |
          . .venv/bin/activate
          python tools/dev.py format-check

      - name: Tests with coverage gate
        run: |
          . .venv/bin/activate
          python tools/dev.py cov

      - name: Commit skill bootstrap is reproducible from a clean checkout
        run: |
          . .venv/bin/activate
          python tools/dev.py bootstrap-check

      - name: Ignore policy holds
        run: |
          . .venv/bin/activate
          python tools/dev.py ignore-policy

      - name: Installed CLI and training fixture run
        run: |
          . .venv/bin/activate
          python tools/dev.py smoke
